[package]
name = "core-service"
version = "0.1.0"
edition = "2021"

[dependencies]
# Minimum required dependencies for Phase 1
tokio = { version = "1.35", features = ["full"] }
tonic = "0.10"
prost = "0.12"
sqlx = { version = "0.7", features = [ "runtime-tokio", "postgres" ] }
redis = { version = "0.24", features = ["tokio-comp"] }

[build-dependencies]
tonic-build = "0.10"
