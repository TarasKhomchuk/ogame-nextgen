syntax = "proto3";

package game;

// Explicit path for Go code generation (needed later for Gateway)
option go_package = "./;main";

// The core action service connecting Gateway (Go) and Game Core (Rust)
service GameService {
    // Processes a single action multiplexed from the WebSocket connection
    rpc ProcessAction (ActionRequest) returns (ActionResponse);
}

// Request structure sent from Go Gateway to Rust Core
message ActionRequest {
    string action = 1;      // e.g., "ping", "planet:build"
    string msg_id = 2;      // Unique correlation ID generated by frontend
    string payload = 3;     // JSON string containing specific action parameters
    int64 user_id = 4;      // Authenticated user ID injected by Go Gateway
}

// Response structure returned from Rust Core to Go Gateway
message ActionResponse {
    string status = 1;      // e.g., "processed", "error"
    string msg_id = 2;      // Matches the incoming request msg_id
    string payload = 3;     // JSON string containing response data for frontend
}
