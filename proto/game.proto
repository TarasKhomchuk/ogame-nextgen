syntax = "proto3";

package game;

option go_package = "./;main";

service GameService {
    rpc ProcessAction (ActionRequest) returns (ActionResponse);
    
    // New RPC for Phase 2 cluster health telemetry monitoring
    rpc GetServerTelemetry (TelemetryRequest) returns (TelemetryResponse);
}

message ActionRequest {
    string action = 1;
    string msg_id = 2;
    string payload = 3;
    int64 user_id = 4;
}

message ActionResponse {
    string status = 1;
    string msg_id = 2;
    string payload = 3;
}

// New Telemetry definitions
message TelemetryRequest {}

message TelemetryResponse {
    bool status = 1;
    string version = 2;
    string uptime = 3;
}
