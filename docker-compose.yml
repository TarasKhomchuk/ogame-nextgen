version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ogame_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # <-- ЦЕЙ РЯДОК ОБОВ'ЯЗКОВИЙ. Він захищає Linux пакети від затирання з Windows.
    environment:
      - WATCHPACK_POLLING=true

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: ogame_gateway
    ports:
      - "8080:8080"
    volumes:
      - ./gateway:/app
      - ./proto:/proto  # Maps the shared protocol buffers interface

  core:
    build:
      context: ./core
      dockerfile: Dockerfile
    container_name: ogame_core
    ports:
      - "50051:50051"
    volumes:
      - ./core:/app
      - ./proto:/proto # Maps the shared proto directory inside the container

  admin-portal:
    build:
      context: ./admin-portal
      dockerfile: Dockerfile
    container_name: ogame_admin_portal
    ports:
      - "5174:5174"
    volumes:
      - ./admin-portal:/app
      - /app/node_modules # Keeps dependencies isolated inside Linux container
    environment:
      - WATCHPACK_POLLING=true

  postgres:
    image: postgres:16-alpine
    container_name: ogame_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=ogame_admin
      - POSTGRES_PASSWORD=ogame_secure_pass
      - POSTGRES_DB=ogame_game_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ogame_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

# Define named persistent volumes at the very bottom of the file (on the same level as 'services:')
volumes:
  pgdata:
  redisdata: